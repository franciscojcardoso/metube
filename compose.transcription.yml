services:
  metube:
    build: .
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      TRANSCRIPTION_URL: http://whisper:9000/v1/audio/transcriptions
      TRANSCRIPTION_MODEL: whisper-1
      TRANSCRIPTION_TIMEOUT: 7200
      TRANSCRIPTION_API_KEY: metube-local-whisper
    volumes:
      - ./downloads:/downloads
    depends_on:
      whisper:
        condition: service_started

  whisper:
    image: hwdsl2/whisper-server
    restart: unless-stopped
    environment:
      WHISPER_MODEL: small
      WHISPER_LANGUAGE: auto
      WHISPER_THREADS: "4"
      WHISPER_BEAM: "1"
      WHISPER_DISABLE_USAGE_COUNTS: "1"
      WHISPER_API_KEY: metube-local-whisper
    volumes:
      - whisper-data:/var/lib/whisper

volumes:
  whisper-data:
